server:
  port: ${SERVER_PORT}

info:
  app:
    name: ResiManager Backoffice
    description: Sistema de gestión de condominios
    version: 1.0-SNAPSHOT
    encoding: UTF-8
    java-version: 21

app:
  api:
    base-url: ${API_BASE_URL:http://localhost:8080}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5000}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  security:
    cookie-secure: ${SECURITY_COOKIE_SECURE:true}
    access-token-ttl-minutes: ${ACCESS_TOKEN_TTL_MINUTES:30}
    refresh-token-ttl-seconds: ${REFRESH_TOKEN_TTL_SECONDS:604800}
    password-reset-ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
    password-min-length: ${PASSWORD_MIN_LENGTH:8}

spring:
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  
  jackson:
    default-property-inclusion: NON_NULL
  
  banner:
    location: classpath:banner.txt
  
  datasource:
    driverClassName: ${DB_DRIVER}
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    generate-ddl: false
    open-in-view: false
    database-platform: ${JPA_DIALECT}
    show-sql: ${JPA_SHOW_SQL}
  
  sql:
    init:
      mode: ${SQL_INIT_MODE}
  
  flyway:
    enabled: ${FLYWAY_ENABLED}
    locations: classpath:migrations
    baseline-on-migrate: true
    baseline-version: 0
    clean-on-validation-error: false
    out-of-order: false
    postgresql:
      # Lock transaccional (pg_advisory_xact_lock): obligatorio cuando la BD vive tras
      # un pooler tipo PgBouncer (Neon "-pooler"). Con lock de sesion el unlock falla
      # ("Unable to release PostgreSQL advisory lock"). Ninguna migracion usa sentencias
      # no transaccionales (p. ej. CREATE INDEX CONCURRENTLY), que exigirian el lock de sesion.
      transactional-lock: true
  
  web:
    resources:
      add-mappings: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    enabled: false
  show-actuator: true
  use-management-port: false

scalar:
  enabled: true
  path: /scalar
  url: /v3/api-docs
  theme: deepSpace
  layout: modern
  showSidebar: true
  showModels: true
  operationSorter: method
  tagSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,flyway,beans
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
    info:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

logging:
  level:
    com.resimanager.backoffice: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
